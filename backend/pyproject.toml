[project]
name = "sistema-provas"
version = "0.1.0"
description = ""
authors = [
    {name = "Gabriel Reis",email = "gabrielreispr@unochapeco.edu.br"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "fastapi[standard] (>=0.128.3,<0.129.0)",
    "jinja2 (>=3.1.6,<4.0.0)",
    "passlib[bcrypt] (>=1.7.4,<2.0.0)",
    "python-multipart (>=0.0.22,<0.0.23)",
    "pyjwt (>=2.11.0,<3.0.0)",
    "pwdlib[argon2] (>=0.3.0,<0.4.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "asyncpg (>=0.30.0,<0.31.0)",
    "sqlalchemy[asyncio] (>=2.0.46,<3.0.0)",
    "greenlet (>=3.0.0,<4.0.0)",
    "fastapi-mail (>=1.4.1,<2.0.0)",
    "redis (>=5.2.0,<6.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 79
extend-exclude = ['migrations']

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT']

[tool.ruff.lint.per-file-ignores]
# Em testes: magic values, import de helpers internos e asserts de
# igualdade explícitos são idiomáticos.
'tests/**' = ['PLR2004', 'PLC2701', 'PLC1901']

[tool.ruff.format]
preview = true
quote-style = 'single'

[tool.pytest.ini_options]
pythonpath = "."
addopts = '-p no:warnings'

[tool.taskipy.tasks]
lint = 'ruff check'
pre_format = 'ruff check --fix'
format = 'ruff format'
run = 'fastapi dev sistema_provas/app.py'
pre_test = 'task lint'
test = 'pytest -s -x --cov=sistema_provas -vv'
post_test = 'coverage html'

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
pytest-cov = "^7.0.0"
taskipy = "^1.14.1"
ruff = "^0.15.0"
factory-boy = "^3.3.3"
pytest-asyncio = "^1.3.0"
aiosqlite = "^0.22.1"
freezegun = "^1.5.5"

