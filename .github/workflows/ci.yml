name: CI

# Gate de qualidade (Sprint 5): lint + testes de backend e testes e2e
# (Playwright) antes de qualquer merge/deploy.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — ruff + pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalar Poetry
        run: pipx install poetry

      - name: Instalar dependências
        run: poetry install --no-interaction

      - name: Lint (ruff)
        run: |
          poetry run ruff check
          poetry run ruff format --check

      - name: Testes (pytest + cobertura)
        run: poetry run pytest -q --cov=sistema_provas

  e2e:
    name: E2E — Playwright (stack Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar .env
        run: cp .env.example .env

      - name: Subir a stack (Docker Compose)
        run: docker compose up -d --build

      - name: Aguardar API e frontend
        run: |
          for i in $(seq 1 60); do
            api=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/ || true)
            web=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/home.html || true)
            echo "tentativa $i: api=$api web=$web"
            if [ "$api" = "200" ] && [ "$web" = "200" ]; then exit 0; fi
            sleep 3
          done
          echo "Stack não respondeu a tempo"; docker compose logs; exit 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Playwright
        working-directory: frontend
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Rodar testes e2e
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:8080
          CI: 'true'
        run: npx playwright test

      - name: Logs da stack (em falha)
        if: failure()
        run: docker compose logs

      - name: Publicar relatório Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
        continue-on-error: true

      - name: Derrubar a stack
        if: always()
        run: docker compose down -v
