name: CI

# Gate de qualidade (Sprint 5): lint + testes de backend e testes e2e
# (Playwright) antes de qualquer merge/deploy.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — ruff + pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalar Poetry
        run: pipx install poetry

      - name: Instalar dependências
        run: poetry install --no-interaction

      - name: Lint (ruff)
        run: |
          poetry run ruff check
          poetry run ruff format --check

      - name: Testes (pytest + cobertura)
        run: poetry run pytest -q --cov=sistema_provas

  frontend-checks:
    name: Frontend — vitest + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: frontend-next
        run: npm ci

      - name: Unit tests (vitest)
        working-directory: frontend-next
        run: npm run test:unit

      - name: Lint (next lint)
        working-directory: frontend-next
        run: npm run lint

  e2e:
    name: E2E — Playwright (stack Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start stack
        run: |
          cp .env.example .env
          docker compose up -d --build

      - name: Wait for API and Web
        run: |
          for i in $(seq 1 60); do curl -sf http://localhost:8000/ && break; sleep 2; done
          for i in $(seq 1 60); do curl -sf http://localhost:3000/login && break; sleep 2; done

      - name: Seed staff account
        run: |
          curl -s -X POST http://localhost:8000/users/ \
            -H 'Content-Type: application/json' \
            -d '{"username":"gestora","email":"gestora@cidadeidoso.com","password":"Gestora@123"}' || true
          docker compose exec -T db psql -U postgres -d cidade_idoso \
            -c "UPDATE users SET role='admin', is_staff=true WHERE email='gestora@cidadeidoso.com';"

      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Run Playwright
        working-directory: frontend-next
        env:
          E2E_BASE_URL: http://localhost:3000
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Logs da stack (em falha)
        if: failure()
        run: docker compose logs

      - name: Publicar relatório Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend-next/playwright-report/
          retention-days: 7
        continue-on-error: true

      - name: Derrubar a stack
        if: always()
        run: docker compose down -v
