<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notícias — Gestão</title>
    <link rel="stylesheet" href="funcionario.css">
    <link rel="stylesheet" href="accessibility.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .staff-news-img-cell { display: flex; flex-direction: column; align-items: flex-start; gap: 0.5rem; }
        .staff-news-thumb { width: 4.5rem; height: 3.375rem; object-fit: cover; border-radius: 0.5rem; border: 1px solid #d6e3da; background: #f1f5f2; }
        .staff-news-noimg { font-size: 0.875rem; color: #4a5a50; }
        /* Esconde o input de arquivo nativo; o <label> estilizado como botão dispara o seletor. */
        .staff-file-input { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
        .staff-file-label { cursor: pointer; display: inline-flex; align-items: center; min-height: 2.75rem; }
        /* Garante foco visível ao navegar via teclado para o input escondido. */
        .staff-file-input:focus + .staff-file-label,
        .staff-file-input:focus-visible + .staff-file-label { outline: 3px solid #01200F; outline-offset: 2px; }
    </style>
</head>
<body class="staff-layout">
    <header class="header">
        <div class="header-container staff-header-bar">
            <div class="staff-header-brand">
                <div class="title-section">
                    <h1 class="main-title">Notícias</h1>
                    <p class="subtitle">Gestão de conteúdo</p>
                </div>
            </div>
            <button type="button" class="staff-btn staff-btn-logout" onclick="staffLogout()">
                <i class="fas fa-sign-out-alt" aria-hidden="true"></i> Sair
            </button>
        </div>
    </header>

    <main class="main-content">
        <div class="staff-back-row">
            <a href="funcionario-home.html" class="staff-back"><i class="fas fa-arrow-left" aria-hidden="true"></i> Voltar ao painel</a>
        </div>

        <div class="staff-panel">
            <h2>Nova notícia</h2>
            <form id="form-noticia" class="staff-form-grid">
                <label>Título
                    <input type="text" id="n-titulo" required maxlength="300" autocomplete="off">
                </label>
                <label>Descrição
                    <textarea id="n-descricao" rows="4" required maxlength="2000"></textarea>
                </label>
                <label>URL (fonte ou link)
                    <input type="url" id="n-fonte" required maxlength="800" placeholder="https://…">
                </label>
                <button type="submit" id="btn-publicar-noticia" class="staff-btn staff-btn-primary"><i class="fas fa-plus" aria-hidden="true"></i> Publicar</button>
            </form>
        </div>

        <div class="staff-panel">
            <h2>Notícias cadastradas</h2>
            <div class="staff-table-wrap">
                <table class="staff-table" id="tabela-noticias">
                    <thead>
                        <tr><th>Imagem</th><th>Título</th><th>Fonte</th><th>Ações</th></tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="api-base.js"></script>
    <script src="funcionario-common.js"></script>
    <script src="funcionario-noticias.js"></script>
    <script src="accessibility.js"></script>
</body>
</html>
