<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividades — Gestão</title>
    <link rel="stylesheet" href="funcionario.css">
    <link rel="stylesheet" href="accessibility.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .staff-occupancy { display: inline-block; margin-top: 0.25rem; font-size: 0.9375rem; font-weight: 600; color: #01200F; }
        .staff-occupancy-full { color: #b00020; }
        .staff-occupancy-open { color: #00800f; }
    </style>
</head>
<body class="staff-layout">
    <header class="header">
        <div class="header-container staff-header-bar">
            <div class="title-section">
                <h1 class="main-title">Atividades</h1>
                <p class="subtitle">Cadastro, inscritos e presença</p>
            </div>
            <button type="button" class="staff-btn staff-btn-logout" onclick="staffLogout()">
                <i class="fas fa-sign-out-alt" aria-hidden="true"></i> Sair
            </button>
        </div>
    </header>

    <main class="main-content">
        <div class="staff-back-row">
            <a href="funcionario-home.html" class="staff-back"><i class="fas fa-arrow-left" aria-hidden="true"></i> Voltar ao painel</a>
        </div>

        <div class="staff-panel">
            <h2>Nova atividade</h2>
            <form id="form-atividade" class="staff-form-grid">
                <label>Título
                    <input type="text" id="a-titulo" required maxlength="200" autocomplete="off">
                </label>
                <label>Horário (texto)
                    <input type="text" id="a-hora" required maxlength="50" placeholder="Ex.: 15h às 16h30" autocomplete="off">
                </label>
                <label>Data / recorrência (texto)
                    <input type="text" id="a-data" required maxlength="120" placeholder="Ex.: Terças e quintas" autocomplete="off">
                </label>
                <label>URL da imagem
                    <input type="url" id="a-img" required maxlength="500" placeholder="https://…">
                </label>
                <label>Vagas (capacidade máxima — opcional)
                    <input type="number" id="a-vagas" min="0" step="1" inputmode="numeric" placeholder="Deixe em branco para sem limite" autocomplete="off">
                </label>
                <button type="submit" id="btn-criar-atividade" class="staff-btn staff-btn-primary"><i class="fas fa-plus" aria-hidden="true"></i> Criar</button>
            </form>
        </div>

        <div class="staff-panel">
            <h2>Atividades cadastradas</h2>
            <p class="staff-hint">Selecione <strong>Gerir</strong> para ver inscritos e marcar presença nesta data.</p>
            <div id="lista-atividades" class="staff-activity-list" aria-live="polite"></div>
        </div>

        <div class="staff-panel" id="panel-detalhe" hidden>
            <h2 id="det-titulo">Detalhe</h2>

            <h3>Inscritos</h3>
            <div class="staff-table-wrap">
                <table class="staff-table" id="tabela-inscritos">
                    <thead>
                        <tr><th>Usuário</th><th>Nome</th><th>Status</th></tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>

            <h3>Presença</h3>
            <div class="staff-presenca-bar">
                <label>Data
                    <input type="date" id="pres-data">
                </label>
                <button type="button" id="btn-carregar-presenca" class="staff-btn staff-btn-secondary">Carregar lista</button>
            </div>
            <div class="staff-table-wrap">
                <table class="staff-table" id="tabela-presenca">
                    <thead>
                        <tr><th>Participante</th><th>Presente</th></tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="api-base.js"></script>
    <script src="funcionario-common.js"></script>
    <script src="funcionario-atividades.js"></script>
    <script src="accessibility.js"></script>
</body>
</html>
